<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!-- Adaptive icon foreground layer (108 dp): Nothung through the Ring.
       Content is scaled to 80 % so it stays well inside the 66 dp safe zone (circle r=132): launcher masks (squircle, teardrop…) crop the edge of that zone. -->
  <g transform="translate(216,216) scale(0.8) translate(-216,-220)">
    <!-- the Ring, behind the blade -->
    <circle cx="216" cy="178" r="70" fill="none" stroke="#C7A863" stroke-width="16"/>
    <path d="M162,134 A70,70 0 0 1 216,108" fill="none" stroke="#E8E0CC" stroke-width="2.5" opacity="0.7"/>
    <!-- blade (lit / shaded halves + fuller) -->
    <polygon points="216,88 231,120 231,270 201,270 201,120" fill="#C7A863"/>
    <polygon points="216,88 231,120 231,270 216,270" fill="#B0914E"/>
    <line x1="216" y1="128" x2="216" y2="262" stroke="#E8E0CC" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- crossguard, grip, pommel -->
    <path d="M166,268 Q216,282 266,268 L266,282 Q216,294 166,282 Z" fill="#C7A863"/>
    <rect x="207" y="286" width="18" height="44" rx="4" fill="#B0914E"/>
    <path d="M207,298 h18 M207,310 h18 M207,322 h18" stroke="#7A5A14" stroke-width="3"/>
    <circle cx="216" cy="340" r="11" fill="#C7A863"/>
    <circle cx="212" cy="336" r="3.5" fill="#E8E0CC" opacity="0.8"/>
    <!-- the Ring, in front of the blade (with a gap to show the interlace) -->
    <clipPath id="blade"><rect x="199" y="200" width="34" height="80"/></clipPath>
    <path d="M190,243 A70,70 0 0 0 242,243" fill="none" stroke="#16181D" stroke-width="24" clip-path="url(#blade)"/>
    <path d="M190,243 A70,70 0 0 0 242,243" fill="none" stroke="#C7A863" stroke-width="16"/>
  </g>
</svg>
